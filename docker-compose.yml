# Prod infra: full stack. db + api + web, all containerized.
# Usage: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lawkku_freshstart23
      POSTGRES_PASSWORD: lawkku_freshstart23
      POSTGRES_DB: lawkku_freshstart23
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawkku_freshstart23"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no host port: only api reaches db over the compose network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://lawkku_freshstart23:lawkku_freshstart23@db:5432/lawkku_freshstart23
      SESSION_COOKIE_NAME: lawkku_freshstart23_session
      # 32-byte base64 key for temp-password encryption. Override in real deploy.
      TEMP_PW_ENC_KEY: "0000000000000000000000000000000000000000000=="
      STORAGE_DIR: /data/storage
      COOKIE_SECURE: "false" # set true behind HTTPS
    ports:
      - "3100:3000"
    volumes:
      - storage:/data/storage

  web:
    build:
      context: . # repo root: web build needs ../src for shared @be/* schemas
      dockerfile: web/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # server-side rewrite target inside the compose network (same-origin /api proxy)
      BACKEND_URL: http://api:3000
    ports:
      - "3001:3001"

volumes:
  pgdata:
  storage:
