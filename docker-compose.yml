# Prod infra: full stack. db + api + web, all containerized.
# Usage: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    # Secrets come from a gitignored .env in this dir (see .env.prod.example). Never inline real values.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no host port: only api reaches db over the compose network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Secret: from gitignored .env (see .env.prod.example). Must match the db creds above.
      DATABASE_URL: ${DATABASE_URL}
      SESSION_COOKIE_NAME: lawkku_freshstart23_session
      # Secret: 32-byte base64 AES-256-GCM key for temp-password encryption. From .env, never commit.
      TEMP_PW_ENC_KEY: ${TEMP_PW_ENC_KEY}
      STORAGE_DIR: /data/storage
      COOKIE_SECURE: "false" # set true behind HTTPS
    ports:
      - "33491:3000"
    volumes:
      - storage:/data/storage

  web:
    build:
      context: . # repo root: web build needs ../src for shared @be/* schemas
      dockerfile: web/Dockerfile
      args:
        # baked into Next route manifest at build time (rewrites evaluated then)
        BACKEND_URL: http://api:3000
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # server-side rewrite target inside the compose network (same-origin /api proxy)
      BACKEND_URL: http://api:3000
    ports:
      # deploy box host ports: web 33490, api 33491. web listens on 33490 in-container (next start -p 33490)
      - "33490:33490"

volumes:
  pgdata:
  storage:
