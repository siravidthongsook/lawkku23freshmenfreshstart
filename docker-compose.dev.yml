# Dev infra: DB only. Backend (pnpm dev) + web (pnpm dev) run locally on host.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: lawkku-freshstart23-db-dev
    environment:
      POSTGRES_USER: lawkku_freshstart23
      POSTGRES_PASSWORD: lawkku_freshstart23
      POSTGRES_DB: lawkku_freshstart23
    ports:
      - "5432:5432" # matches .env.example DATABASE_URL for local pnpm dev
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawkku_freshstart23"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
