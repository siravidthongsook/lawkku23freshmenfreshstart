# Manual-only prod deploy. Runs on the self-hosted runner on the prod box.
# Never triggers on push/PR — Boss dispatches it by hand (prod is live with real users).
name: Deploy prod (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm (prod is live)'
        required: true
        default: ''
      services:
        description: 'Services to rebuild (blank = all). e.g. "api" or "web api"'
        required: false
        default: ''

# Block overlapping deploys; let an in-flight one finish (do not cancel a live deploy).
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # Quality gate — must pass before anything touches prod. Runs against the dispatched commit
  # (runner's _work checkout), NOT the live deploy clone. Any failure hard-stops the run.
  gate:
    runs-on: [self-hosted, eticket]
    services:
      # Throwaway Postgres for the backend test suite. global-setup CREATEs eticket_test + migrates.
      # Bind host 33399 (not 5432) so it can't collide with any other 5432 listener on the box.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lawkku_freshstart23
          POSTGRES_PASSWORD: lawkku_freshstart23
          POSTGRES_DB: lawkku_freshstart23
        ports:
          - 33399:5432
        options: >-
          --health-cmd "pg_isready -U lawkku_freshstart23"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Guard — require explicit DEPLOY confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::confirm input must be 'DEPLOY' (got '${{ github.event.inputs.confirm }}'). Aborting."
            exit 1
          fi

      - name: Checkout dispatched commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install deps (root + web)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: Typecheck (backend + web)
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm --dir web typecheck

      # Backend test suite. .env.test points DATABASE_URL at localhost:33399/eticket_test → service above.
      - name: Test (backend)
        run: pnpm test

  deploy:
    needs: gate # no deploy unless the gate (confirm + typecheck + test) passed
    # Custom label so this hits ONLY the eticket runner, not the shared ITL runner.
    runs-on: [self-hosted, eticket]
    # Single working dir for every step: the real deploy clone (tracks main), NOT _work checkout.
    defaults:
      run:
        working-directory: /home/siravid/projects/eticket
    steps:
      # 1. Record where prod is BEFORE we pull. Used by auto-rollback to return to known-good code.
      - name: Capture FROM_SHA (current live commit)
        id: from
        run: |
          set -euo pipefail
          echo "from_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 2. Block a partial-services deploy that would skip api while migrations are pending.
      # Recreating web/db (but not api) against an un-migrated schema mismatches the running api.
      - name: Guard — no pending migrations on a partial deploy that excludes api
        env:
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail
          # Empty services = full deploy (api included) -> always safe, skip the guard.
          if [ -z "$SERVICES" ]; then echo "full deploy — guard n/a"; exit 0; fi
          # If api is in the subset, it gets rebuilt+migrated -> safe.
          if echo " $SERVICES " | grep -qw api; then echo "api included — guard n/a"; exit 0; fi
          # Fail-safe: anything that is NOT exactly the literal `none` (incl. a script error) counts as pending.
          pend="$(bash scripts/migrations-pending.sh || echo pending)"
          if [ "$pend" != "none" ]; then
            echo "::error::pending migrations (or check failed: '$pend') but this deploy excludes 'api'. Include api or run a full deploy."
            exit 1
          fi
          echo "no pending migrations — partial deploy ok"

      # 3. Snapshot DB + storage tagged with FROM_SHA before any change. Capture filenames.
      - name: Backup DB + storage
        id: backup
        run: |
          set -euo pipefail
          # Script prints `db_backup=<path>` / `storage_backup=<path>` KEY lines on stdout (human log -> stderr).
          # grep the keys so stray docker stdout can't shift positions like the old sed -n 1p/2p did.
          out=$(bash scripts/db-backup.sh "${{ steps.from.outputs.from_sha }}")
          echo "$out" | grep -E '^db_backup=' | cut -d= -f2- | sed 's/^/db_backup=/' >> "$GITHUB_OUTPUT"
          echo "$out" | grep -E '^storage_backup=' | cut -d= -f2- | sed 's/^/storage_backup=/' >> "$GITHUB_OUTPUT"

      # 4. Retag current images as :prev so auto-rollback can `up --no-build` instantly.
      - name: Retag current images for fast rollback
        run: |
          set -euo pipefail
          docker image tag eticket-api:latest eticket-api:prev || true
          docker image tag eticket-web:latest eticket-web:prev || true

      # 5. Pull the dispatched main. --ff-only fails fast if the clone diverged.
      - name: Pull latest main
        id: pull
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "to_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Now at: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

      # 6. Build only — DO NOT recreate yet. A build failure here leaves prod serving old code.
      - name: Build images (no recreate)
        run: |
          set -euo pipefail
          docker compose build ${{ github.event.inputs.services }}

      # 7. Migrate as an explicit one-shot, BEFORE recreate. drizzle migrate is atomic per run.
      # Failure here aborts with nothing recreated -> old app still serves old code on the intact
      # schema -> safe, no rollback needed. Steps 6+7 stay coupled so we never migrate a stale image.
      - name: Migrate DB (one-shot)
        run: |
          set -euo pipefail
          if ! docker compose run --rm api pnpm db:migrate; then
            echo "::error::migration failed — NOTHING recreated, old app still serving on intact schema."
            echo "::error::db backup: ${{ steps.backup.outputs.db_backup }}"
            exit 1
          fi

      # 8. Recreate containers with the freshly built images. Brief downtime is accepted.
      - name: Recreate containers
        id: recreate
        run: |
          set -euo pipefail
          docker compose up -d ${{ github.event.inputs.services }}

      # 9. Verify: container "Up" != serving. /ready is DB-backed (catches broken schema/connection
      # that static /health would mask). Fail the job if anything is down.
      - name: Verify — containers healthy + HTTP serving
        id: verify
        run: |
          set -euo pipefail
          docker compose ps

          # Catch a restarting/exited container (boot failure).
          bad=$(docker compose ps --format '{{.Service}} {{.State}}' | awk '$2 != "running" {print}')
          if [ -n "$bad" ]; then
            echo "::error::container(s) not running:"
            echo "$bad"
            docker compose logs --tail=80 api
            exit 1
          fi

          # Poll api /ready (DB-backed). Retry: build/migrate takes a beat to serve.
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://localhost:33491/ready >/dev/null; then echo "api ready"; break; fi
            if [ "$i" = 30 ]; then
              echo "::error::api /ready never came up after 30 tries"
              docker compose logs --tail=80 api
              exit 1
            fi
            sleep 2
          done

          # Poll web root (host port 33490).
          for i in $(seq 1 30); do
            if curl -fsS -m 5 -o /dev/null http://localhost:33490/; then echo "web ok"; break; fi
            if [ "$i" = 30 ]; then
              echo "::error::web never came up after 30 tries"
              docker compose logs --tail=80 web
              exit 1
            fi
            sleep 2
          done

          echo "Deploy verified: containers running + api/web serving HTTP."
          echo "Deployed ${{ steps.pull.outputs.to_sha }} | db backup: ${{ steps.backup.outputs.db_backup }} | storage backup: ${{ steps.backup.outputs.storage_backup }}"

      # NOTE (I5): observability is a SEPARATE compose project (`-p eticket_obs`) with its own lifecycle.
      # The verify step above runs `docker compose ps` in this job's working-directory (the app deploy
      # clone), so it stays scoped to the app project ONLY — a down exporter never rolls back an app
      # deploy. Do NOT add any observability compose bring-up to this workflow.

      # Discord alert — deploy SUCCESS (green). Fires only when the verify step passed.
      # Webhook URL comes from a secret; never inline it.
      - name: Notify Discord — deploy success
        if: success() && steps.verify.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # Skip silently if the webhook isn't configured (keeps deploy from failing on a missing secret).
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then echo "no DISCORD_WEBHOOK_URL set — skipping notify"; exit 0; fi
          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Embed color 3066993 = green.
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @- <<JSON
          {
            "embeds": [{
              "title": "✅ eTicket prod deploy succeeded",
              "color": 3066993,
              "fields": [
                { "name": "commit", "value": "${{ steps.pull.outputs.to_sha }}", "inline": true },
                { "name": "time",   "value": "$NOW", "inline": true },
                { "name": "run",    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
              ]
            }]
          }
          JSON

      # 10. AUTO-ROLLBACK (code-only) — scoped to post-recreate failures (step 8 or 9). Migrate-fail
      # (step 7) aborts before this point and needs no rollback. Auto-rollback is code-only: we
      # re-checkout FROM_SHA and reuse the :prev images (instant, no rebuild). DB is NOT auto-restored
      # because that is destructive (overwrites rows) — restore is a deliberate manual rollback.yml run.
      - name: Auto-rollback (code-only) on recreate/verify failure
        id: rollback
        if: failure() && (steps.recreate.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail
          echo "Rolling back code to ${{ steps.from.outputs.from_sha }} using :prev images..."
          git checkout "${{ steps.from.outputs.from_sha }}"

          # Scope rollback to EXACTLY the services that were deployed — never recreate db on a code-only rollback.
          # Empty SERVICES = full deploy -> roll back api+web. Non-empty -> only the {api,web} subset that was deployed.
          if [ -z "$SERVICES" ]; then
            ROLL="api web"
          else
            ROLL=""
            echo " $SERVICES " | grep -qw api && ROLL="$ROLL api"
            echo " $SERVICES " | grep -qw web && ROLL="$ROLL web"
          fi
          ROLL="$(echo "$ROLL" | xargs)" # trim
          echo "Rolling back services: ${ROLL:-<none>}"

          # Nothing code-rollable (e.g. a db-only deploy) -> no code to revert. Bail WITHOUT a bare
          # `up --no-build` (which, with no service arg, would recreate every service incl. db).
          if [ -z "$ROLL" ]; then
            echo "::error::deploy of [$SERVICES] failed but has no code-rollable service (api/web) — manual intervention required. DB was NOT restored."
            exit 1
          fi

          # Retag each rolled-back service's :prev -> :latest. Guard first: a missing :prev (first-ever deploy)
          # means `up --no-build` would re-run the BAD image while falsely claiming success — so fail loud instead.
          # No `|| true` on the retag: a genuinely missing tag must be loud.
          for svc in $ROLL; do
            if ! docker image inspect "eticket-$svc:prev" >/dev/null 2>&1; then
              echo "::error::no eticket-$svc:prev image to roll back to (first deploy?) — manual intervention required"
              exit 1
            fi
            docker image tag "eticket-$svc:prev" "eticket-$svc:latest"
          done

          docker compose up -d --no-build $ROLL

          # Re-verify the rolled-back stack. (best-effort: don't let a failed poll mask the rollback report)
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://localhost:33491/ready >/dev/null; then echo "api ready (rolled back)"; break; fi
            if [ "$i" = 30 ]; then echo "::error::api /ready did not recover after rollback"; docker compose logs --tail=80 api; fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -fsS -m 5 -o /dev/null http://localhost:33490/; then echo "web ok (rolled back)"; break; fi
            if [ "$i" = 30 ]; then echo "::error::web did not recover after rollback"; docker compose logs --tail=80 web; fi
            sleep 2
          done

          echo "::error::Rolled back code to ${{ steps.from.outputs.from_sha }}. DB was NOT restored (db backup: ${{ steps.backup.outputs.db_backup }}). The bad commit is STILL on origin/main — git revert it before the next deploy or it will re-ship. If the schema is incompatible, manually run rollback.yml with restore_db=true."
          exit 1

      # Discord alert — ROLLBACK fired (red). `always()` so it sends even though the rollback step
      # above exits 1 and the job is failing. Conditioned on the rollback step having actually run
      # (its `if:` gates it to recreate/verify failures), so it never fires on a clean deploy.
      # Mirrors the ::error:: text at the end of the rollback step.
      - name: Notify Discord — rollback fired
        if: always() && steps.rollback.outcome != 'skipped' && steps.rollback.outcome != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then echo "no DISCORD_WEBHOOK_URL set — skipping notify"; exit 0; fi
          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Embed color 15158332 = red.
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @- <<JSON
          {
            "embeds": [{
              "title": "🚨 eTicket prod deploy ROLLED BACK",
              "color": 15158332,
              "description": "Code rolled back to **${{ steps.from.outputs.from_sha }}** using :prev images. **DB was NOT restored** (a DB restore is a deliberate manual rollback.yml run with restore_db=true). The bad commit is **STILL on origin/main** — git revert it before the next deploy or it will re-ship.",
              "fields": [
                { "name": "rolled back to", "value": "${{ steps.from.outputs.from_sha }}", "inline": true },
                { "name": "time",           "value": "$NOW", "inline": true },
                { "name": "db backup",      "value": "${{ steps.backup.outputs.db_backup }}" },
                { "name": "run",            "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
              ]
            }]
          }
          JSON
