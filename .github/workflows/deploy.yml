# Manual-only prod deploy. Runs on the self-hosted runner on the prod box.
# Never triggers on push/PR — Boss dispatches it by hand (prod is live with real users).
name: Deploy prod (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm (prod is live)'
        required: true
        default: ''
      services:
        description: 'Services to rebuild (blank = all). e.g. "api" or "web api"'
        required: false
        default: ''

# Block overlapping deploys; let an in-flight one finish (do not cancel a live deploy).
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Custom label so this hits ONLY the eticket runner, not the shared ITL runner.
    runs-on: [self-hosted, eticket]
    steps:
      - name: Guard — require explicit DEPLOY confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::confirm input must be 'DEPLOY' (got '${{ github.event.inputs.confirm }}'). Aborting."
            exit 1
          fi

      # Operate on the real deploy clone, NOT the runner's _work checkout.
      - name: Pull latest main
        working-directory: /home/siravid/projects/eticket
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "Now at: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

      - name: Build & recreate containers
        working-directory: /home/siravid/projects/eticket
        run: |
          set -euo pipefail
          # api auto-runs `pnpm db:migrate` on boot (see Dockerfile CMD).
          docker compose up -d --build ${{ github.event.inputs.services }}

      # Real smoke test: container "Up" != serving. Poll actual HTTP, fail the job if down.
      - name: Verify — containers healthy + HTTP serving
        working-directory: /home/siravid/projects/eticket
        run: |
          set -euo pipefail
          docker compose ps

          # Migration crash-loops the api (CMD: db:migrate && start). Catch a restarting/exited container.
          bad=$(docker compose ps --format '{{.Service}} {{.State}}' | awk '$2 != "running" {print}')
          if [ -n "$bad" ]; then
            echo "::error::container(s) not running (migration crash or boot failure):"
            echo "$bad"
            docker compose logs --tail=80 api
            exit 1
          fi

          # Poll api /health (host port 33491 -> api :3000). Retry: build/migrate takes a beat to serve.
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://localhost:33491/health >/dev/null; then echo "api ok"; break; fi
            if [ "$i" = 30 ]; then
              echo "::error::api /health never came up after 30 tries"
              docker compose logs --tail=80 api
              exit 1
            fi
            sleep 2
          done

          # Poll web root (host port 33490).
          for i in $(seq 1 30); do
            if curl -fsS -m 5 -o /dev/null http://localhost:33490/; then echo "web ok"; break; fi
            if [ "$i" = 30 ]; then
              echo "::error::web never came up after 30 tries"
              docker compose logs --tail=80 web
              exit 1
            fi
            sleep 2
          done

          echo "Deploy verified: containers running + api/web serving HTTP."
