# Notification routing policy (design §5).
# Everything goes to Discord. Group by alertname so a flapping rule = one thread.
apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    # Re-notify every 4h while still firing so a long outage isn't forgotten.
    repeat_interval: 4h
